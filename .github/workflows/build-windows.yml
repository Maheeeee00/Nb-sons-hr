name: Build Windows installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Package HR server (hr-server.exe)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --noconsole --name hr-server `
            --add-data "server/templates;templates" --add-data "server/static;static" `
            --hidden-import waitress --hidden-import openpyxl `
            --icon desktop/server-app/src-tauri/icons/icon.ico --paths server server/server_main.py
          New-Item -ItemType Directory -Force desktop/server-app/src-tauri/binaries | Out-Null
          Copy-Item dist/hr-server.exe desktop/server-app/src-tauri/binaries/hr-server-x86_64-pc-windows-msvc.exe
      - name: Smoke-test hr-server.exe
        shell: pwsh
        run: |
          $env:HR_DATA = "$env:RUNNER_TEMP\hrdata"; $env:HR_PORT = "5099"
          $p = Start-Process -FilePath dist/hr-server.exe -PassThru
          Start-Sleep 15
          $r = Invoke-RestMethod http://127.0.0.1:5099/api/ping
          if ($r.app -ne 'nbsons-hr') { throw "HR server did not answer" }
          Get-Process hr-server -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/server-app/src-tauri
            desktop/client-app/src-tauri
      - name: Build server installer
        working-directory: desktop/server-app
        run: |
          npm install
          npx tauri build
      - name: Build client installer
        working-directory: desktop/client-app
        run: |
          npm install
          npx tauri build
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item desktop/server-app/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item desktop/client-app/src-tauri/target/release/bundle/nsis/*.exe out/
      - uses: actions/upload-artifact@v4
        with: { name: NB-Sons-HR-installers, path: out/*.exe }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: NB Sons HR 1.1.${{ github.run_number }}
          files: out/*.exe
          body: |
            Version 1.1: Windows notifications with sound + NB Sons logo.
            NB Sons HR Server setup -> install on the ONE main PC.
            NB Sons HR setup -> install on every other office PC.
