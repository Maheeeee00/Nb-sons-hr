{% extends "base.html" %}
{% from "_m.html" import csrf %}
{% block title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:440px">
  {% if user.must_change %}<div class="note">For security, please choose your own password now.</div>{% endif %}
  <form method="post" class="grid">
    {{ csrf() }}
    <div><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
    <div><label>New password (min 6 characters)</label><input type="password" name="new" required minlength="6" autocomplete="new-password"></div>
    <div><label>Confirm new password</label><input type="password" name="confirm" required minlength="6" autocomplete="new-password"></div>
    <div><button class="btn primary">Save password</button></div>
  </form>
</div>
{% endblock %}
