<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  @page { size: A4 portrait; margin: 12mm; }
  body.dc-page{background:#e8edf2;margin:0;padding:24px;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#0f1f33}
  .dc-tools{max-width:820px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dc-tools .hint{color:#64748b;font-size:12.5px;margin-left:auto}
  .dc{max-width:820px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(15,42,68,.12);overflow:hidden;min-height:1080px;display:flex;flex-direction:column;animation:dcIn .45s ease both}
  @keyframes dcIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .dc-band{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 34px;background:linear-gradient(135deg,#0f2a44,#0e7c86);color:#fff}
  .dc-co{display:flex;align-items:center;gap:16px}
  .dc-co img{height:54px;background:#fff;border-radius:10px;padding:5px 8px}
  .dc-co h1{margin:0;font-size:21px}.dc-co small{opacity:.85;font-size:12.5px;display:block}
  .dc-title{text-align:right}.dc-title b{display:block;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
  .dc-title span{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:20px}
  .dc-body{padding:26px 40px 20px;flex:1;font-size:14.5px;line-height:1.7}
  .dc-meta{display:flex;justify-content:space-between;font-size:13px;color:#334155;margin-bottom:18px}
  .dc-body h2{font-size:17px;text-align:center;text-decoration:underline;text-underline-offset:5px;margin:6px 0 16px;letter-spacing:.03em}
  .dc-body p{margin:0 0 12px}
  .dc-body table.dc-t{width:100%;border-collapse:collapse;margin:8px 0 14px}
  .dc-body table.dc-t td,.dc-body table.dc-t th{border:1px solid #dbe3ea;padding:7px 12px;font-size:13.5px;text-align:left}
  .dc-body table.dc-t th{background:#f1f5f9;font-weight:700}
  .dc-body table.dc-t td.n,.dc-body table.dc-t th.n{text-align:right;font-variant-numeric:tabular-nums}
  .dc-body table.dc-t tr.tot td{font-weight:800;background:#f8fafc}
  .dc-body ol,.dc-body ul{margin:0 0 12px;padding-left:22px}
  .dc-sign{display:flex;justify-content:space-between;gap:40px;margin-top:46px}
  .dc-sign div{flex:1;max-width:240px;border-top:1.5px solid #0f1f33;padding-top:6px;font-size:12.5px;font-weight:700;text-align:center}
  .dc-sign div small{display:block;font-weight:400;color:#64748b}
  .dc-foot{padding:10px 34px;border-top:3px solid #0e7c86;font-size:11px;color:#64748b;display:flex;justify-content:space-between}
  [contenteditable]:focus{outline:2px dashed #14b8a6;outline-offset:6px;border-radius:4px}
  .dc-edit{background:#fffbeb;border:1px dashed #f59e0b;color:#92400e;border-radius:10px;padding:6px 12px;font-size:12.5px}
  @media print{
    body.dc-page{background:#fff;padding:0}.dc-tools{display:none}
    .dc{box-shadow:none;border-radius:0;max-width:none;min-height:auto;animation:none}
    .dc-band,.dc-foot,.dc-body table.dc-t th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
