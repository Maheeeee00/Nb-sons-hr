<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NB Sons HR Server</title>
<style>
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",Inter,Arial,sans-serif;background:linear-gradient(135deg,#0f2a44,#0e7c86);color:#fff;
       display:grid;place-items:center}
  .box{width:min(520px,90vw);text-align:center}
  .logobox{background:#fff;border-radius:18px;padding:14px 18px;display:inline-block;margin-bottom:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)} .logobox img{height:74px;display:block}
  .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;font-weight:800;font-size:30px;
        background:linear-gradient(135deg,#f97316,#ef4444);box-shadow:0 12px 30px rgba(0,0,0,.25)}
  h1{margin:0 0 6px;font-size:24px} p{margin:0;opacity:.85}
  .spin{width:34px;height:34px;margin:26px auto 0;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
        animation:r 0.9s linear infinite} @keyframes r{to{transform:rotate(360deg)}}
  .err{display:none;margin-top:24px;background:#fff;color:#7f1d1d;border-radius:14px;padding:16px 18px;text-align:left;
       white-space:pre-line;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .err b{display:block;margin-bottom:6px;color:#991b1b}
  button{margin-top:14px;border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:#0e7c86;color:#fff;cursor:pointer}
</style></head>
<body>
  <div class="box">
    <div class="logobox"><img src="logo.png" alt="Nazir's N.B"></div>
    <h1>NB Sons HR Server</h1>
    <p id="msg">Starting the HR system…</p>
    <div class="spin" id="spin"></div>
    <div class="err" id="err"><b>Couldn't start the HR system</b><span id="errtext"></span>
      <div><button onclick="retry()">Try again</button></div></div>
  </div>
<script>
  window.showError = function (m) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').textContent = 'Something needs attention';
    document.getElementById('errtext').textContent = m;
    document.getElementById('err').style.display = 'block';
  };
  window.retry = function () {
    document.getElementById('err').style.display = 'none';
    document.getElementById('spin').style.display = 'block';
    document.getElementById('msg').textContent = 'Starting the HR system…';
    if (window.__TAURI__) window.__TAURI__.core.invoke('retry_start');
  };
  setTimeout(function () { document.getElementById('msg').textContent = 'Starting the HR system… (first start can take up to 30 seconds)'; }, 6000);
</script>
</body></html>
